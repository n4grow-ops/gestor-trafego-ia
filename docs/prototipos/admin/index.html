    <div class="page-head"><div><h1>Meta</h1><p>App, permissões e o caminho até a aprovação</p></div><div class="actions"><a class="btn" href="#">${icon('ext')}Abrir painel do app</a></div></div>
    <section class="panel" style="margin-bottom:1.25rem"><div class="panel-head"><h2>Caminho até qualquer cliente conectar sozinho</h2><span class="chip warn">etapa 2 de 4</span></div>
      <div class="panel-body"><div class="roadmap"><div class="rm done"><b>BM verificada</b><small>Ana Moura · ok</small></div><div class="rm now"><b>Política e termos</b><small>falta razão social e CNPJ</small></div><div class="rm"><b>App em Live</b><small>botão no painel do app</small></div><div class="rm"><b>Análise da Meta</b><small>6 permissões · vídeo do fluxo</small></div></div></div></section>
    <div class="meta-grid">
      <section class="panel"><div class="panel-head"><h2>App meuanuncio.ia</h2><span class="chip warn">desenvolvimento</span></div>
        <div class="panel-body"><dl class="kv"><dt>ID do app</dt><dd class="num">1057529180620555</dd><dt>BM</dt><dd>Ana Moura · verificada</dd><dt>Configuração de login</dt><dd class="num">1627695515704691</dd><dt>Usuário do sistema</dt><dd>MeuanuncioSystem · <span class="chip warn">Funcionário</span></dd><dt>Token</dt><dd><span class="chip ok">válido · não expira</span></dd></dl>
        <h3 class="sec-title">Permissões</h3>${['ads_management', 'ads_read', 'business_management', 'pages_show_list', 'pages_read_engagement', 'pages_manage_ads'].map(p => `<div class="perm"><svg class="ico-sm check-ico"><use href="#i-check"/></svg><code>${p}</code><span class="chip">acesso padrão</span></div>`).join('')}</div></section>
      <section class="panel"><div class="panel-head"><h2>Conexões</h2></div>
        <div class="panel-body"><div class="big-num"><div><b>21</b><small>ativas</small></div><div><b>2</b><small>revogadas pelo cliente</small></div><div><b>0</b><small>pedidos de exclusão</small></div></div>
        <h3 class="sec-title">Testadores do app</h3>${[['Fernanda Costa', 'aceitou', 'ok'], ['Camila Ribeiro', 'aceitou', 'ok'], ['Bruno Carvalho', 'pendente', 'warn'], ['Rodrigo Dias', 'pendente há 26 h', 'warn'], ['Vanessa Teixeira', 'pendente', 'warn']].map(([n, s, k]) => `<div class="perm"><span class="mini-av" style="width:1.6rem;height:1.6rem;font-size:.625rem">${ini(n)}</span>${n}<span class="chip ${k}">${s}</span></div>`).join('')}</div></section>
    </div>
  </div></div>`;

views.config = () => `<div class="page admin-only-page">
  <div class="lockwall"><span class="big-ico">${icon('lock', 'ico')}</span><b>Só administradores</b><p class="muted">Peça a um administrador para mudar ajustes do sistema.</p></div>
  <div class="admin-content">
    <div class="page-head"><div><h1>Configurações</h1><p>Mudanças valem na hora, sem publicar de novo</p></div></div>
    <div class="settings">
      <nav class="set-nav"><a href="#s-robo">Robô</a><a href="#s-alertas">Alertas</a><a href="#s-rel">Relatório diário</a><a href="#s-cad">Cadastro automático</a><a href="#s-txt">Textos do robô</a><a href="#s-team">Equipe</a></nav>
      <div>
        <section class="panel set-sec" id="s-robo"><h2>Robô de testadores</h2><p>Ritmo dos convites no painel da Meta</p>
          <div class="set-row"><div><b>Robô ligado</b><small>Desligue quando a Meta aprovar o app</small></div><button class="switch" role="switch" aria-checked="true" data-dirty></button></div>
          <div class="set-row"><div><b>Convites por dia</b><small>Acima de 25 aumenta o risco de bloqueio</small></div><div class="range"><input type="range" min="5" max="40" value="20" data-out="o-lim" data-dirty><output id="o-lim">20</output></div></div>
          <div class="set-row"><div><b>Intervalo entre convites</b><small>Em minutos</small></div><div class="range"><input type="range" min="1" max="15" value="4" data-out="o-int" data-dirty><output id="o-int">4</output></div></div>
          <div class="set-row"><div><b>Horário permitido</b><small>Fora dele os pedidos esperam na fila</small></div><div style="display:flex;gap:.5rem"><input class="field-input" value="08:00" data-dirty><input class="field-input" value="22:00" data-dirty></div></div>
        </section>
        <section class="panel set-sec" id="s-alertas"><h2>Alertas</h2><p>Quem recebe no WhatsApp quando algo quebra</p>
          <div class="set-row"><div><b>Número da equipe</b><small>Hoje vazio: nenhum alerta sai</small></div><input class="field-input num" placeholder="5511…" data-dirty></div>
          ${['WhatsApp do bot caiu', 'Robô travou ou a Meta pediu confirmação', 'Cliente travado há mais de 24 h', 'Token da Meta inválido'].map((t, i) => `<div class="set-row"><div><b>${t}</b></div><button class="switch" role="switch" aria-checked="${i !== 2}" data-dirty></button></div>`).join('')}
        </section>
        <section class="panel set-sec" id="s-rel"><h2>Relatório diário</h2><p>Resumo às 8h no WhatsApp</p>
          <div class="set-row"><div><b>Enviar relatório</b><small>Cadastros, conexões e campanhas do dia anterior</small></div><button class="switch" role="switch" aria-checked="false" data-dirty></button></div></section>
        <section class="panel set-sec" id="s-cad"><h2>Cadastro automático</h2><p>Quem fala com o bot vira cliente sem aprovação</p>
          <div class="set-row"><div><b>Ligado</b></div><button class="switch" role="switch" aria-checked="true" data-dirty></button></div>
          <div class="set-row"><div><b>Orçamento máximo por dia</b><small>Em reais, por campanha</small></div><div class="range"><input type="range" min="10" max="200" step="10" value="50" data-out="o-orc" data-dirty><output id="o-orc">50</output></div></div>
          <div class="set-row"><div><b>Novos cadastros por dia</b></div><div class="range"><input type="range" min="10" max="200" step="10" value="60" data-out="o-cad" data-dirty><output id="o-cad">60</output></div></div></section>
        <section class="panel set-sec" id="s-txt"><h2>Textos do robô</h2><p>O que o bot manda em cada momento · a prévia mostra como chega no WhatsApp</p>
          ${[['Pedir o perfil do Facebook', 'Pra liberar a conexão da sua conta de anúncios, me manda o link do seu perfil do Facebook. No app: seu perfil › ⋯ › Copiar link do perfil.'], ['Como aceitar o convite', 'Pronto! Te adicionei no meuanuncio. Agora toca aqui e aceita o convite: facebook.com/settings?tab=applications'], ['Lembrete de aceite', 'Oi! Ainda falta aceitar o convite pra gente conectar sua conta. Leva 10 segundos 🙂']].map(([l, v], i) => `<div class="tpl"><div><label for="tpl-${i}">${l}</label><textarea class="field-input" id="tpl-${i}" data-prev="prev-${i}" data-dirty>${v}</textarea></div><div class="tpl-prev"><div class="b out" id="prev-${i}">${v}<span class="t">agora ✓✓</span></div></div></div>`).join('')}
        </section>
        <section class="panel set-sec" id="s-team"><h2>Equipe</h2><p>Quem entra em admin.meuanuncio.io</p>
          ${[['Guilherme', 'guilherme@meuanuncio.io', 'Administrador', 'ok'], ['Marina', 'marina@meuanuncio.io', 'Funcionário', ''], ['Pedro', 'pedro@meuanuncio.io', 'Funcionário · convite pendente', 'warn']].map(([n, e, r, k]) => `<div class="team-row"><span class="mini-av">${ini(n)}</span><div><b>${n}</b><small>${e}</small></div><span class="chip ${k}">${r}</span><button class="btn sm ghost">Editar</button></div>`).join('')}
          <div style="display:flex;gap:.5rem;margin-top:1rem"><input class="field-input" placeholder="e-mail da pessoa" style="max-width:20rem"><button class="btn primary sm">${icon('user-plus')}Convidar</button></div>
        </section>
      </div>
    </div>
  </div></div>`;

views.registro = () => {
  const rows = [
    ['09:44', 'Marina', 'Assumiu a conversa', 'Carlos Mendes'], ['09:31', 'Robô', 'Convidou como testador', 'Bruno Carvalho'],
    ['09:12', 'Guilherme', 'Mudou convites por dia de 15 para 20', 'Configurações'], ['08:57', 'Sistema', 'Sessão do WhatsApp caiu', 'WAHA'],
    ['ontem 18:40', 'Marina', 'Reenviou link de conexão', 'Rodrigo Dias'], ['ontem 16:47', 'Guilherme', 'Publicou campanha pausada', 'Ana Beatriz Souza'],
    ['ontem 11:02', 'Guilherme', 'Zerou contato de teste', '5511971214993'], ['seg 10:15', 'Pedro', 'Marcou convite como feito à mão', 'Fernanda Costa'],
  ].filter(r => role() === 'admin' || r[1] === 'Marina' || r[1] === 'Robô' || r[1] === 'Sistema');
  return `<div class="page"><div class="page-head"><div><h1>Registro de ações</h1><p>${role() === 'admin' ? 'Tudo o que a equipe, o robô e o sistema fizeram' : 'Suas ações, as do robô e as do sistema'}</p></div>
    <div class="seg"><button aria-pressed="true">Tudo</button><button aria-pressed="false">Equipe</button><button aria-pressed="false">Robô</button><button aria-pressed="false">Sistema</button></div></div>
    <div class="list">${rows.map((r, i) => `<div class="log-row" style="--i:${i}"><time>${r[0]}</time><span class="actor"><span class="mini-av">${r[1] === 'Robô' ? icon('bot') : r[1] === 'Sistema' ? icon('db') : ini(r[1])}</span>${r[1]}</span><span>${r[2]}</span><span class="chip">${r[3]}</span></div>`).join('')}</div></div>`;
};

/* ===================== roteamento ===================== */
function render(quiet = false) {
  const route = (location.hash.replace('#/', '') || 'visao');
  const name = views[route] ? route : 'visao';
  clearTimers();
  $('#view').classList.toggle('quiet', quiet);
  const go = () => {
    $('#view').innerHTML = views[name]();
    $('#view').scrollTop = 0;
    $$('#nav a').forEach(a => a.dataset.route === name ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    document.body.classList.remove('side-open'); $('#side-backdrop').classList.remove('on');
    $$('.cu').forEach(countUp);
    if (name === 'visao') startFeed();
    if (name === 'robo') startRobot();
    if (name === 'whatsapp' && state.waDown) startQR();
    if (name === 'conversas') startTyping();
    syncStatus();
  };
  !quiet && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches ? document.startViewTransition(go) : go();
}
function syncStatus() {
  $('#dot-wa').className = 'dot ' + (state.waDown ? 'err' : '');
  $('#dot-robo').className = 'dot ' + (state.robotOn ? '' : 'off');
}
function startTyping() {
  const ty = $('#typing'); if (!ty) return;
  state.timers.push(setTimeout(() => {
    if (state.human || !ty.isConnected) { ty.remove(); return; }
    ty.outerHTML = `<div class="b out"><span class="who-ai">Gestor · IA</span>Pode sim, assim que chegar a segunda em melhor qualidade eu monto a prévia do anúncio pra você ver antes 👍<span class="t">09:42 ✓✓</span></div>`;
    $('#msgs').scrollTop = 1e6;
  }, 2600));
  $('#msgs').scrollTop = 1e6;
}
window.addEventListener('hashchange', render);

/* ===================== eventos ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.roleBtn) {
    document.body.dataset.role = t.dataset.roleBtn;
    $$('[data-role-btn]').forEach(b => b.setAttribute('aria-pressed', b === t));
    $('#role-label').textContent = t.dataset.roleBtn === 'admin' ? 'Administrador' : 'Funcionário';
    toast(t.dataset.roleBtn === 'admin' ? 'Vendo como administrador' : 'Vendo como funcionário: ações sensíveis bloqueadas', 'info', 'shield');
    if (['registro', 'meta', 'config'].includes(location.hash.replace('#/', ''))) render();
    return;
  }
  if (t.dataset.openClient) { e.preventDefault(); openClient(t.dataset.openClient); return; }
  if (t.dataset.closeDrawer !== undefined) return closeDrawer();
  if (t.dataset.dtab) return setDrawerTab(+t.dataset.dtab);
  if (t.dataset.gotoChat !== undefined) { closeDrawer(); location.hash = '#/conversas'; return; }
  if (t.dataset.confirm) { $('#confirm').classList.add('on'); return; }
  if (t.dataset.confirmNo !== undefined) { $('#confirm').classList.remove('on'); return; }
  if (t.dataset.confirmYes !== undefined) { $('#confirm').classList.remove('on'); closeDrawer(); toast('Contato zerado. Ação registrada no log.', 'warn', 'refresh'); return; }
  if (t.dataset.act) { t.classList.add('loading'); setTimeout(() => { t.classList.remove('loading'); toast(t.dataset.act); }, 700); return; }
  if (t.dataset.filter) { state.filter = t.dataset.filter; render(); return; }
  if (t.dataset.stage) { state.filter = 'etapa' + t.dataset.stage; location.hash = '#/clientes'; return; }
  if (t.dataset.gotoFilter) { state.filter = t.dataset.gotoFilter; }
  if (t.dataset.chat) { state.selChat = +t.dataset.chat; state.human = false; render(); $('#chat-wrap')?.classList.add('open'); return; }
  if (t.dataset.backChats !== undefined) { $('#chat-wrap').classList.remove('open'); return; }
  if (t.id === 'takeover') { state.human = !state.human; render(); toast(state.human ? 'Você assumiu a conversa. A IA está pausada para este cliente.' : 'Conversa devolvida à IA.', state.human ? 'warn' : 'ok', 'hand'); return; }
  if (t.id === 'send') {
    const ta = $('#composer'); if (!ta.value.trim()) return;
    const b = document.createElement('div'); b.className = 'b out human-msg';
    b.innerHTML = `<span class="who-ai">Guilherme · equipe</span>${esc(ta.value)}<span class="t">agora ✓</span>`;
    $('#msgs').append(b); ta.value = ''; $('#msgs').scrollTop = 1e6; return;
  }
  if (t.id === 'toggle-robot') { state.robotOn = !state.robotOn; render(); toast(state.robotOn ? 'Robô retomado.' : 'Robô pausado. Os pedidos esperam na fila.', state.robotOn ? 'ok' : 'warn', state.robotOn ? 'play' : 'pause'); return; }
  if (t.id === 'relogin') { t.classList.add('loading'); setTimeout(() => { t.classList.remove('loading'); toast('Sessão do robô renovada.', 'ok', 'refresh'); }, 1200); return; }
  if (t.dataset.retry !== undefined) { const it = t.closest('.q-item'); it.style.transition = 'opacity .3s, transform .3s'; it.style.opacity = 0; it.style.transform = 'translateX(-12px)'; setTimeout(() => it.remove(), 300); toast('Voltou para a fila.', 'info', 'refresh'); return; }
  if (t.dataset.publish !== undefined) { t.classList.add('loading'); setTimeout(() => { const row = $('#pub-' + t.dataset.publish); row.classList.add('done-pub'); t.classList.remove('loading', 'primary'); t.innerHTML = icon('check') + 'Publicada'; t.disabled = true; toast('Campanha criada pausada na conta do cliente.', 'ok', 'mega'); }, 1400); return; }
  if (t.id === 'gen-qr') { clearTimers(); startQR(); return; }
  if (t.id === 'restart-wa') { t.classList.add('loading'); setTimeout(() => { t.classList.remove('loading'); toast('Sessão reiniciada. Aguardando leitura do QR.', 'info', 'refresh'); }, 1000); return; }
  if (t.id === 'simulate-scan') { state.waDown = false; clearTimers(); render(); toast('WhatsApp reconectado: 5511971214993.', 'ok', 'wa'); return; }
  if (t.classList.contains('switch')) { t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true'); markDirty(); return; }
  if (t.id === 'save') { const b = t; b.classList.add('loading'); setTimeout(() => { b.classList.remove('loading'); state.dirty = false; $('#savebar').classList.remove('on'); toast('Configurações salvas.'); }, 700); return; }
  if (t.id === 'discard') { state.dirty = false; $('#savebar').classList.remove('on'); render(); return; }
  if (t.closest('.seg') && !t.dataset.filter) { $$('button', t.closest('.seg')).forEach(b => b.setAttribute('aria-pressed', b === t)); return; }
  if (t.id === 'menu-btn') { document.body.classList.add('side-open'); $('#side-backdrop').classList.add('on'); return; }
  if (t.id === 'open-cmdk') { openCmdk(); return; }
  if (t.id === 'bell') { toast('3 alertas: WhatsApp caído, 1 falha do robô, 5 clientes travados.', 'err', 'bell'); return; }
});
$('#drawer-backdrop').addEventListener('click', closeDrawer);
$('#side-backdrop').addEventListener('click', () => { document.body.classList.remove('side-open'); $('#side-backdrop').classList.remove('on'); });
function markDirty() { if (!state.dirty) { state.dirty = true; $('#savebar').classList.add('on'); } }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'client-q') { state.q = t.value; const pos = t.selectionStart; render(true); const n = $('#client-q'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.dataset.out) $('#' + t.dataset.out).textContent = t.value;
  if (t.dataset.prev) $('#' + t.dataset.prev).innerHTML = esc(t.value) + '<span class="t">agora ✓✓</span>';
  if (t.dataset.dirty !== undefined) markDirty();
  if (t.id === 'cmdk-q') fillCmdk(t.value);
});

/* paleta de comandos */
const CMDS = [
  ['Ir para Visão geral', '#/visao', 'home'], ['Ir para Clientes', '#/clientes', 'users'], ['Ir para Conversas', '#/conversas', 'chat'],
  ['Ir para Robô de testadores', '#/robo', 'bot'], ['Ir para Campanhas', '#/campanhas', 'mega'], ['Gerar QR do WhatsApp', '#/whatsapp', 'qr'],
  ['Ver clientes travados', 'travados', 'clock'], ['Configurações', '#/config', 'cog'],
];
let cmdSel = 0;
function fillCmdk(q = '') {
  q = q.toLowerCase();
  const cl = clients.filter(c => !q || (c.name + c.phone + c.seg).toLowerCase().includes(q)).slice(0, 5);
  const ac = CMDS.filter(c => !q || c[0].toLowerCase().includes(q));
  const items = [...cl.map(c => ({ label: c.name, sub: c.seg, ico: 'users', run: () => openClient(c.id) })), ...ac.map(([l, h, ic]) => ({ label: l, ico: ic, run: () => { if (h === 'travados') { state.filter = 'travados'; location.hash = '#/clientes'; render(); } else location.hash = h; } }))];
  cmdSel = 0;
  $('#cmdk-list').innerHTML = (cl.length ? '<h4>Clientes</h4>' : '') + items.map((it, i) => (i === cl.length && ac.length ? '<h4>Ações</h4>' : '') + `<button class="cmdk-item" data-i="${i}" aria-selected="${i === 0}">${icon(it.ico)}${it.label}${it.sub ? `<small>${it.sub}</small>` : ''}</button>`).join('') || '<p class="muted" style="padding:1rem">Nada encontrado.</p>';
  $('#cmdk-list').onclick = e => { const b = e.target.closest('.cmdk-item'); if (b) { $('#cmdk').close(); items[+b.dataset.i].run(); } };
  $('#cmdk').items = items;
}
function openCmdk() { const d = $('#cmdk'); $('#cmdk-q').value = ''; fillCmdk(); d.showModal(); $('#cmdk-q').focus(); }
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdk(); }
  if (e.key === 'Escape' && $('#drawer').classList.contains('on')) closeDrawer();
  const d = $('#cmdk');
  if (d.open && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    const btns = $$('.cmdk-item'); if (!btns.length) return;
    if (e.key === 'Enter') { e.preventDefault(); d.close(); d.items[cmdSel].run(); return; }
    e.preventDefault(); cmdSel = (cmdSel + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
    btns.forEach((b, i) => b.setAttribute('aria-selected', i === cmdSel)); btns[cmdSel].scrollIntoView({ block: 'nearest' });
  }
});
$('#cmdk').addEventListener('click', e => { if (e.target === $('#cmdk')) $('#cmdk').close(); });

render();
</script>
</body>
</html>
